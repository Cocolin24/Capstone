<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login - RPTS</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" href="image/rplogo.png">
    <link rel="stylesheet" href="../css/loading.css">
    <link rel="stylesheet" href="css/admin-login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="avatar">
                <img src="image/rplogo.png" alt="RPTS Logo" />
            </div>
            <form id="adminLoginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="email" id="email" placeholder="Email" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" />
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <div class="options">
                    <label><input type="checkbox" id="rememberMe"/>Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <div class="form-group recaptcha-container">
                <div class="g-recaptcha" data-sitekey="6Lfz8wIsAAAAALEAZmY07hu0sdG7DQd5hJ_XT-r3" data-callback="onRecaptchaSuccess" data-theme="dark">
                </div>
                <span class="recaptcha-error-message" id="recaptchaError" 
                style="display: none; color: #ff4444; font-size: 14px; margin-top: 5px;">Please complete the reCAPTCHA verification.</span>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <p id="errorMsg" style="color: red; display: none; margin-top: 10px;"> </p>
        </div>
        <footer class="final-footer">
            <h2>RPTS<sup>®</sup></h2>
        </footer>
    </div>

    <!-- Custom JS file -->
    <script src="../js/loading.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
