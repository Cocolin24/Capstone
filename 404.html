<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Real Pain Tattoo Studio</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="admin/image/rplogo.png">
    <link rel="stylesheet" href="css/loading.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Animated Background */
        .ink-drops {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ink-drop {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #d4d4d4;
            border-radius: 50%;
            animation: inkFall 4s linear infinite;
            opacity: 0.7;
        }

        .ink-drop:nth-child(1) { left: 10%; animation-delay: 0s; }
        .ink-drop:nth-child(2) { left: 20%; animation-delay: 0.8s; }
        .ink-drop:nth-child(3) { left: 30%; animation-delay: 1.6s; }
        .ink-drop:nth-child(4) { left: 40%; animation-delay: 2.4s; }
        .ink-drop:nth-child(5) { left: 60%; animation-delay: 3.2s; }
        .ink-drop:nth-child(6) { left: 70%; animation-delay: 4s; }
        .ink-drop:nth-child(7) { left: 80%; animation-delay: 4.8s; }
        .ink-drop:nth-child(8) { left: 90%; animation-delay: 5.6s; }

        @keyframes inkFall {
            0% {
                top: -10px;
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        /* Main Container */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        /* 404 Number */
        .error-number {
            font-size: 12rem;
            font-weight: bold;
            background: linear-gradient(45deg, #666, #d4d4d4, #999);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite, bounce 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(212, 212, 212, 0.3);
            cursor: pointer;
        }

        .error-number:hover {
            animation: shake 0.5s ease-in-out, shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Title and Message */
        .error-title {
            font-size: 2.5rem;
            margin: 2rem 0 1rem;
            color: #d4d4d4;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .error-message {
            font-size: 1.2rem;
            color: #999;
            margin-bottom: 3rem;
            max-width: 600px;
            animation: fadeInUp 1s ease-out 1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 1s ease-out 1.5s both;
        }

        .btn {
            padding: 15px 30px;
            border: 2px solid #666;
            background: transparent;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #666;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        /* Floating Elements */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .floating-needle {
            position: absolute;
            font-size: 2rem;
            color: #666;
            animation: float 4s ease-in-out infinite;
        }

        .needle-1 { top: 20%; left: 10%; animation-delay: 0s; }
        .needle-2 { top: 60%; right: 15%; animation-delay: 2s; }
        .needle-3 { bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg); 
                opacity: 0.3;
            }
            50% { 
                transform: translateY(-20px) rotate(10deg); 
                opacity: 0.7;
            }
        }

        /* Easter Egg Trigger */
        .easter-egg-trigger {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            color: #333;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .easter-egg-trigger:hover {
            color: #666;
            transform: scale(1.2) rotate(15deg);
        }

        /* Easter Egg Animation */
        .easter-egg-active .error-number {
            animation: rainbow 1s ease-in-out infinite, spin 2s linear infinite;
        }

        @keyframes rainbow {
            0% { color: #ff0000; }
            16% { color: #ff8000; }
            32% { color: #ffff00; }
            48% { color: #00ff00; }
            64% { color: #0080ff; }
            80% { color: #8000ff; }
            100% { color: #ff0000; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #d4d4d4;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .error-number {
                font-size: 8rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-message {
                font-size: 1rem;
                padding: 0 1rem;
            }
            
            .button-group {
                flex-direction: column;
                gap: 1rem;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="ink-drops">
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
        <div class="ink-drop"></div>
    </div>

    <!-- Floating Elements -->
    <div class="floating-elements">
        <div class="floating-needle needle-1">🪡</div>
        <div class="floating-needle needle-2">✏️</div>
        <div class="floating-needle needle-3">🎨</div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <div class="error-number" id="errorNumber">404</div>
        <h1 class="error-title">Oops! This Page Got Lost</h1>
        <p class="error-message">
            Looks like this page wandered off while getting a tattoo! 
            Don't worry, even the best artists sometimes miss their mark. 
            Let's get you back to where the real art happens.
        </p>
        
        <div class="button-group">
            <a href="/index.html" class="btn">
                <span><i class="fas fa-home"></i> Back to Home</span>
            </a>
            <a href="/gallery.html" class="btn">
                <span><i class="fas fa-images"></i> View Gallery</span>
            </a>
            <a href="/book-now.html" class="btn">
                <span><i class="fas fa-calendar-plus"></i> Book Session</span>
            </a>
        </div>
    </div>

    <!-- Easter Egg Trigger -->
    <button class="easter-egg-trigger" id="easterEggBtn" title="Click me for a surprise! 🥚">
        🥚
    </button>

    <script>
        // Easter Egg Functionality
        let easterEggActive = false;
        let clickCount = 0;

        document.getElementById('easterEggBtn').addEventListener('click', function() {
            activateEasterEgg();
        });

        // Secret: Click the 404 number 5 times for extra easter egg
        document.getElementById('errorNumber').addEventListener('click', function() {
            clickCount++;
            if (clickCount >= 5) {
                superEasterEgg();
                clickCount = 0;
            }
        });

        function activateEasterEgg() {
            if (easterEggActive) return;
            
            easterEggActive = true;
            document.body.classList.add('easter-egg-active');
            
            // Create confetti
            createConfetti();
            
            // Play sound effect (if you want to add audio)
            // playSound('surprise.mp3');
            
            // Change title temporarily
            const originalTitle = document.title;
            document.title = "🎉 SURPRISE! You found the easter egg! 🎉";
            
            setTimeout(() => {
                document.body.classList.remove('easter-egg-active');
                document.title = originalTitle;
                easterEggActive = false;
            }, 5000);
        }

        function superEasterEgg() {
            // Secret message
            const messages = [
                "🎨 You're a true art detective! 🕵️",
                "💉 Master of hidden needles! 🪡",
                "🌟 Easter egg champion! 🏆",
                "🎪 You've unlocked the secret! 🗝️",
                "🎭 The ultimate explorer! 🗺️"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            // Create floating message
            const messageEl = document.createElement('div');
            messageEl.textContent = randomMessage;
            messageEl.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(45deg, #666, #d4d4d4);
                color: white;
                padding: 20px 40px;
                border-radius: 20px;
                font-size: 1.5rem;
                font-weight: bold;
                z-index: 1000;
                animation: bounceIn 0.8s ease-out;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            `;
            
            document.body.appendChild(messageEl);
            
            // Remove message after 3 seconds
            setTimeout(() => {
                messageEl.remove();
            }, 3000);
            
            // Extra confetti
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createConfetti(), i * 200);
            }
        }

        function createConfetti() {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.backgroundColor = getRandomColor();
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 100);
            }
        }

        function getRandomColor() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd', '#98d8c8'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // Add CSS for bounceIn animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes bounceIn {
                0% {
                    transform: translate(-50%, -50%) scale(0.3);
                    opacity: 0;
                }
                50% {
                    transform: translate(-50%, -50%) scale(1.1);
                    opacity: 1;
                }
                100% {
                    transform: translate(-50%, -50%) scale(1);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);

        // Add some random floating elements on page load
        setTimeout(() => {
            createFloatingEmoji();
        }, 2000);

        function createFloatingEmoji() {
            const emojis = ['🎨', '🪡', '✨', '🎭', '🌟'];
            const emoji = document.createElement('div');
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.cssText = `
                position: absolute;
                font-size: 2rem;
                pointer-events: none;
                z-index: 2;
                animation: floatAway 8s linear infinite;
                top: ${Math.random() * 80 + 10}%;
                left: -50px;
            `;
            
            document.body.appendChild(emoji);
            
            setTimeout(() => {
                emoji.remove();
            }, 8000);
        }

        // Add CSS for floatAway animation
        const floatStyle = document.createElement('style');
        floatStyle.textContent = `
            @keyframes floatAway {
                0% {
                    transform: translateX(0) rotate(0deg);
                    opacity: 0;
                }
                10% {
                    opacity: 1;
                }
                90% {
                    opacity: 1;
                }
                100% {
                    transform: translateX(calc(100vw + 50px)) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(floatStyle);

        // Randomly create floating emojis
        setInterval(createFloatingEmoji, 5000);
    </script>

    <!-- Loading Screen Script -->
    <script src="js/loading.js"></script>
</body>
</html>
